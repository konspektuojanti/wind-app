<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eismo info weather station</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100..700&display=swap');

        body {
            background: #F5DBC6;
            color: #0D0D0D;
            font-family: 'Roboto Mono', monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        h1 { text-align: center; }

        .row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #C6F5F3;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .label {
            display: block;
            font-size: 0.75rem;
            font-weight: 300;
            text-transform: uppercase;
        }

        .value { font-size: 1.25rem; font-weight: 600; }

        @media (max-width: 600px) {
            .row { grid-template-columns: 1fr; }
        }
        /* From Uiverse.io by MuhammadHasann */ 
.toggle-cont {
  width: 100px;
  height: 50px;
  border-radius: 9999px;
}

.toggle-cont .toggle-input {
  display: none;
}

.toggle-cont .toggle-label {
  cursor: pointer;
  position: relative;
  display: inline-block;
  padding: 6px;
  width: 100%;
  height: 100%;
  background: #272727;
  border-radius: 9999px;
  box-sizing: content-box;
  box-shadow: 0px 0px 16px -8px #fefefe;
}

.toggle-cont .toggle-label .cont-label-play {
  position: relative;
  width: 50px;
  aspect-ratio: 1 / 1;
  background: #5e5e5e;
  border-radius: 9999px;
  transition: all 0.5s cubic-bezier(1, 0, 0, 1);
}

.toggle-cont .toggle-input:checked + .toggle-label .cont-label-play {
  background: #f43f5e;
  transform: translateX(50px);
}

.toggle-cont .toggle-label .label-play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: inline-block;
  width: 24px;
  aspect-ratio: 1 / 1;
  background: #fefefe;
  border-radius: 4px;
  clip-path: polygon(25% 0, 75% 50%, 25% 100%, 25% 51%);
  transition: all 0.5s cubic-bezier(1, 0, 0, 1);
}

.toggle-cont .toggle-input:checked + .toggle-label .label-play {
  width: 20px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
}
    </style>
</head>
<body>
    <h1 id="station-name"></h1>

    <div class="row">
        <div><span class="label">Kilometre</span><span class="value" id="kilometer"></span></div>
        <div><span class="label">Latitude</span><span class="value" id="lat"></span></div>
        <div><span class="label">Longitude</span><span class="value" id="lng"></span></div>
    </div>

    <div class="row">
        <div><span class="label">Air temp (°C)</span><span class="value" id="air-temp"></span></div>
        <div><span class="label">Road temp (°C)</span><span class="value" id="road-temp"></span></div>
        <div><span class="label">Dew point (°C)</span><span class="value" id="dew-point"></span></div>
    </div>

    <div class="row">
        <div><span class="label">Wind avg (m/s)</span><span class="value" id="wind-avg"></span></div>
        <div><span class="label">Wind max (m/s)</span><span class="value" id="wind-max"></span></div>
        <div><span class="label">Wind direction</span><span class="value" id="wind-dir"></span></div>
    </div>

    <div class="row">
        <div><span class="label">Precipitation type</span><span class="value" id="precip-type"></span></div>
        <div><span class="label">Precipitation amount</span><span class="value" id="precip-amount"></span></div>
        <div><span class="label">Friction coefficient</span><span class="value" id="friction"></span></div>
    </div>

   <div class="toggle-cont">
  <input class="toggle-input" id="toggle" name="toggle" type="checkbox" />
  <label class="toggle-label" for="toggle">
    <div class="cont-label-play">
      <span class="label-play"></span>
    </div>
  </label>
</div>
    <script src="app.js"></script>
</body>
</html>
